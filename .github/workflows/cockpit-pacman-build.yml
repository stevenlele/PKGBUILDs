name: Build cockpit-pacman

on:
  pull_request:
    paths:
      - cockpit-pacman
      - .github/workflows/cockpit-pacman-build.yml
  push:
    branches:
      - main
    paths:
      - cockpit-pacman
      - .github/workflows/cockpit-pacman-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cockpit-pacman-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out AUR submodule
        run: git submodule update --init --depth 1 cockpit-pacman

      - name: Build package
        uses: docker://archlinux:base-devel
        with:
          entrypoint: /usr/bin/bash
          args: >-
            -c "pacman -Syu --noconfirm --needed gnupg sudo &&
            useradd --create-home --uid 1001 builder &&
            printf 'builder ALL=(ALL:ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder &&
            chmod 0440 /etc/sudoers.d/builder &&
            runuser -u builder -- bash -c '
            gpg --keyserver hkps://keyserver.ubuntu.com --recv-keys 100A50E46DC2C244F838DCBFABD48F465F4434BD &&
            makepkg --dir cockpit-pacman --syncdeps --noconfirm'"

      - name: Remove debug package
        run: rm cockpit-pacman/*-debug-*.pkg.tar.zst

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: cockpit-pacman
          path: cockpit-pacman/*.pkg.tar.zst
          if-no-files-found: error

      - name: Upload package to Codeberg
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          for package in cockpit-pacman/*.pkg.tar.zst; do
            curl --fail-with-body --request PUT \
              https://codeberg.org/api/packages/stevenlele/arch/custom \
              --header "Authorization: Bearer $CODEBERG_TOKEN" \
              --header 'Content-Type: application/octet-stream' \
              --data-binary "@$package"
          done
